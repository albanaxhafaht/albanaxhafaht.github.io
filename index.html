<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Redirecting…</title>
</head>
<body>
<p id="m">Redirecting…</p>
<script id="maria-links" type="application/json">{"cheesy-ground-beef-quesadillas":"https://lifewithnina.com/cheesy-ground-beef-quesadillas/","cheesy-penne-with-garlic-butter-ground-beef":"https://lifewithnina.com/cheesy-penne-with-garlic-butter-ground-beef/","cheesy-rotini-pasta-with-garlic-butter-sauce-and-ground-beef":"https://lifewithnina.com/cheesy-rotini-pasta-with-garlic-butter-sauce-and-ground-beef/","cheesy-velveeta-rotini-with-italian-beef-marinara":"https://lifewithnina.com/cheesy-velveeta-rotini-with-italian-beef-marinara/","comforting-ground-beef-goulash":"https://lifewithnina.com/comforting-ground-beef-goulash/"}</script>
<script>
(function () {
  var links = JSON.parse(document.getElementById("maria-links").textContent);
  var parts = location.search.replace(/^\?/, "").split("&");
  var slug = "";
  try { slug = decodeURIComponent(parts.shift() || ""); } catch (e) {}
  slug = slug.toLowerCase().replace(/\/+$/, "");
  var to = links[slug];
  if (!to) { document.title = "Page not found"; document.getElementById("m").textContent = "Page not found."; return; }
  var extra = parts.filter(Boolean).join("&");
  if (extra) {
    var h = to.indexOf("#"), hash = h < 0 ? "" : to.slice(h), u = h < 0 ? to : to.slice(0, h);
    to = u + (u.indexOf("?") < 0 ? "?" : "&") + extra + hash;
  }
  location.replace(to);
})();
</script>
</body>
</html>
